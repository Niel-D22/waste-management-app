    <style>
      /* ──────────────────────────────────────────────────────────────────
         Layar pembuka.

         Ditulis SEBARIS di sini, bukan sebagai komponen React, dan itu inti
         seluruh gagasannya. Komponen React baru bisa tampil setelah ~500 KB
         JavaScript selesai diunduh dan dijalankan — justru masa layar putih
         yang mau ditutupi. Blok ini tergambar dari byte pertama HTML, sebelum
         satu baris JavaScript pun berjalan.

         Logonya disisipkan sebagai data URI (11 KB) supaya ikut tergambar di
         frame yang sama. Kalau dirujuk sebagai berkas terpisah, ia butuh satu
         perjalanan jaringan lagi dan logonya berkedip muncul belakangan.
         ────────────────────────────────────────────────────────────────── */
      #pembuka {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.75rem;
        background: #ffffff;
        transition: opacity 0.45s ease, visibility 0.45s ease;
      }
      #pembuka img {
        width: 92px;
        height: auto;
        animation: pembukaDenyut 1.8s ease-in-out infinite;
      }
      #pembuka .rel {
        width: 132px;
        height: 3px;
        overflow: hidden;
        border-radius: 999px;
        background: #dfeaf7;
      }
      #pembuka .rel span {
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: #1e1f78;
        animation: pembukaGeser 1.15s ease-in-out infinite;
      }
      @keyframes pembukaDenyut {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.06); opacity: 0.86; }
      }
      @keyframes pembukaGeser {
        0% { transform: translateX(-115%); }
        100% { transform: translateX(365%); }
      }

      /* Ditambahkan JavaScript begitu aplikasinya siap. */
      #pembuka.selesai {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      /* Jaring pengaman: kalau JavaScript gagal dimuat sama sekali, layar ini
         akan menyembunyikan diri sendiri setelah 8 detik. Tanpa ini, kegagalan
         apa pun berarti pengunjung terkurung di layar putih selamanya. */
      #pembuka {
        animation: pembukaMenyerah 0s linear 8s forwards;
      }
      @keyframes pembukaMenyerah {
        to { opacity: 0; visibility: hidden; pointer-events: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        #pembuka img,
        #pembuka .rel span {
          animation: none;
        }
      }

      /* Disalin dari index.css alih-alih dipinjam dari sana: berkas itu dimuat
         sebagai stylesheet terpisah, jadi pada saat layar ini tergambar aturan
         .sr-only-nya belum tentu sudah tiba — dan teks "Memuat…" akan terlihat
         sekilas sebagai tulisan biasa di tengah layar. */
      #pembuka .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>
  </head>
